# Frontend CI: every quality gate is its own job, so each shows as a separate
# check on the PR and can be required individually in branch protection.
#
#   Lint ───────┐
#   Typecheck ──┤  (parallel)
#   Tests ──────┤
#   Build ──────┴──► Bundle budget
#                └──► Lighthouse CI
#
# Deploy (S3 + CloudFront) is added in Phase 7 as a separate workflow.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the stale run (saves minutes, faster feedback).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

env:
  # Same release id everywhere: RUM `version`, Sentry `release`, source maps.
  VITE_APP_VERSION: ${{ github.sha }}
  VITE_DD_ENV: ci

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-web
      - run: npm run lint
        working-directory: web

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-web
      - run: npm run typecheck
        working-directory: web

  test:
    name: Unit + a11y tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-web
      - name: Vitest + axe-core
        run: npm test
        working-directory: web

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-web
      - run: npx vite build
        working-directory: web
      # Later jobs test this exact artifact instead of rebuilding.
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  bundle-size:
    name: Bundle budget
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      # Plain Node script, no npm install needed.
      - run: node scripts/check-bundle-size.mjs
        working-directory: web

  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-web
        with:
          with-api: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Start API (pages call /api via the preview proxy)
        run: |
          node api/server.js &
          npx --yes wait-on http://localhost:3001/api/health
      - name: Performance + accessibility budgets
        run: npx lhci autorun
        working-directory: web
